<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" href="./public/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
  <link rel="shortcut icon" href="./public/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./public/apple-touch-icon.png" />
  <!-- manifest handled by vite-plugin-pwa -->

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://res.cloudinary.com; connect-src 'self' http://localhost:5000 https://z-events.vercel.app;">

  <!-- Primary SEO Meta Tags -->
  <title>Z-Events | Smart Event Management & Seamless Payments</title>
  <meta name="title" content="Z-Events | Smart Event Management & Seamless Payments" />
  <meta name="description"
    content="Z-Events is a modern platform that makes it easy to create, manage, and track events with seamless payments, secure ticketing, and powerful analytics tools." />
  <meta name="keywords"
    content="Z-Events, event platform, event ticketing, online payments, event management, Africa events, Ghana events, ticket sales, event planning tools, payments integration" />
  <meta name="author" content="Z-Events Team" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://z-events.vercel.app/" />
  <meta property="og:title" content="Z-Events | Events & Payments Made Simple" />
  <meta property="og:description"
    content="Create events, sell tickets, accept payments, and manage everything in one fast, modern dashboard." />
  <meta property="og:image" content="https://z-events.vercel.app/og-banner.png" />

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://z-events.vercel.app/" />
  <meta name="twitter:title" content="Z-Events | Events & Payments Made Simple" />
  <meta name="twitter:description"
    content="A modern event management platform for creators, organizers, and communities." />
  <meta name="twitter:image" content="https://z-events.vercel.app/og-banner.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
